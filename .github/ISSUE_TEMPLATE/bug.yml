## 现象

## 取证（重要）

压缩相关的断言请尽量附**会话日志的 `compaction/*` 事件**，这是最有价值的证据：

```powershell
$p = "$env:USERPROFILE\.dsh\sessions\--<PROJECT>--\<SESSION-ID>\session.v4.jsonl.zstd"
```

关键字段（`session.v4.jsonl.zstd` 是**多帧** zstd，Node 单次 `zstdDecompressSync` 只解首帧）：

| 字段 | 含义 |
|---|---|
| `compaction/start` · `compaction/end` | 每轮的触发与结束 |
| `compaction/summary` 的 `compactionId` | 事务 ID |
| `shadowedRange` / `shadowedSeqs` | 被压的区间（**判断"压没压、压了多少"看这里**） |
| `shadowedTokenCount` | ⚠️ **不可信**，见下方注意 |
| `request/context` 的 `contextWindow` | 该轮的实际窗口 |
| `assistant/message` 的 `usage.inputTokens` | **该轮真实输入 token** |
| `model/selection` | 模型切换事件 |

> ⚠️ **`shadowedTokenCount` 不可信**：实测它把整个前缀（含 system 头与工具 schema）都算进去了，
> 单条显示 ~57.4 万、累计 1155 万。**请用 `usage.inputTokens` 复算**。

